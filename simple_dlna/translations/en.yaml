configuration:
  device:
    name: Storage device
    description: >
      Select the USB partition to store backups.
      You can specify the partition name (e.g., sdb1), label (e.g., backups),
      or UUID (e.g., 7589979c-3104-462c-b08f-a3ce44034334).
      Leave empty to detect available devices.

  media_dir:
    name: Media directory
    description: >
      Specify the directory on the connected storage device
      containing media files for the DLNA server.
      For example: dlna.
      The value must be a directory name.

  friendly_name:
    name: DLNA server name
    description: >
      The name under which the server will appear
      in DLNA clients and media players.
      
  log_level:
    name: ReadyMedia log level
    description: >
      Specify the logging level for the DLNA server.
      A more detailed level can be useful
      when troubleshooting problems.
