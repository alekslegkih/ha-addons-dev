configuration:
  device:
    name: Устройство хранения
    description: >
      Укажите раздел накопителя с медиафайлами.
      Можно указать имя раздела (например: sdb1), метку
      (например: dlna) или UUID
      (например: 445ceeab-ad36-4624-856d-c562596668a2).
      Оставьте пустым для отображения доступных устройств.

  media_dir:
    name: Каталог с медиафайлами
    description: >
      Укажите каталог на подключённом накопителе, содержащий
      медиафайлы для DLNA-сервера.
      Например: dlna.
      Значение должно быть именем каталога без начального символа /.

  friendly_name:
    name: Имя DLNA-сервера
    description: >
      Имя, под которым сервер будет отображаться
      в DLNA-клиентах и медиаплеерах.

  log_level:
    name: Уровень логирования ReadyMedia
    description: >
      Укажите уровень логирования DLNA-сервера.
      Более подробный уровень может быть полезен
      при диагностике проблем.
