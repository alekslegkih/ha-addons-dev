name: MQTT2API
version: "0.0.3"
slug: mqtt2api
description: MQTT to WebAPI/WebSocket bridge for IoT devices
url: "https://github.com/alekslegkih/ha-addons/tree/main/mqtt2api"
arch:
  - amd64
  - aarch64
image: ghcr.io/alekslegkih/mqtt2api-dev

startup: application
boot: auto
init: false
hassio_api: true
services:
  - mqtt:need
map:
  - ssl:ro
options:
  api_secret: ""
  modules: []
  certfile: /ssl/fullchain.pem
  keyfile: /ssl/privkey.pem
  log_level: warning
schema:
  api_secret: password
  modules:
    - str
  certfile: str
  keyfile: str
  log_level: list(off|fatal|error|warn|info|debug)
ports:
  "52341/tcp": 52341
ports_description:
  "52341/tcp": HTTP/WebSocket API (TLS)
