name: Redis
slug: redis
description: Redis database server
version: "0.1.1"

url: "https://github.com/alekslegkih/ha-addons/tree/main/redis"
image: ghcr.io/alekslegkih/redis-dev

arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false

map:
  - app_config:rw

options:
  maxmemory: "128mb"
  maxmemory_policy: "allkeys-lru"
schema:
  maxmemory: str
  maxmemory_policy: list(noeviction|allkeys-lru|allkeys-lfu|allkeys-random|volatile-lru|volatile-lfu|volatile-random|volatile-ttl)

ports:
  6379/tcp: null
ports_description:
  6379/tcp: Server
